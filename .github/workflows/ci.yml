name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Match the other Cats repos: detect documentation-only changes inside the
  # workflow so required checks still report. Documentation is docs/ plus the
  # root agent instructions (AGENTS.md, CLAUDE.md, CODEX.md, GEMINI.md) while
  # they are added or modified; any other change to one, or a nested copy, is code.
  # Code that already passed skips too: the fingerprint covers every tracked file
  # outside docs/ (the root agent files by path, not content), so a rebase that
  # only brings in documentation reuses the earlier green run. A pull request's
  # cache is scoped to that request, so a push to main instead reuses its merged
  # pull request's run when that run tested the same tree. The required producer
  # and reproducibility checks still run and pass under their usual names; only
  # steps are skipped. An unknown base never counts as documentation-only, and a
  # manual run or failed detection runs every step.
  # tests/docs-boundary.test.mjs keeps tests and scripts from reading docs/ or
  # the root agent files.
  changes:
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's: checkout and the merge lookups read
    # contents, the merged pull request and its CI runs.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          code=true
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            # Include both sides of renames across the docs/ boundary. An added or
            # modified root AGENTS.md, CLAUDE.md, CODEX.md or GEMINI.md is
            # documentation; any other status, such as a deletion, the old side
            # of a rename or a type change, is code, and so are nested copies.
            # A failed diff keeps code=true.
            if changed=$(git diff --no-renames --name-only "$base" HEAD) &&
              code_changed=$(git diff --no-renames --name-only "$base" HEAD -- . ':(top,exclude)docs/' ':(top,exclude)AGENTS.md' ':(top,exclude)CLAUDE.md' ':(top,exclude)CODEX.md' ':(top,exclude)GEMINI.md') &&
              agents_removed=$(git diff --no-renames --name-only --diff-filter=am "$base" HEAD -- ':(top)AGENTS.md' ':(top)CLAUDE.md' ':(top)CODEX.md' ':(top)GEMINI.md'); then
              printf 'Changed files:\n%s\n' "$changed"
              if [ -n "$changed" ] && [ -z "$code_changed" ] && [ -z "$agents_removed" ]; then code=false; fi
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
      - name: Fingerprint the code under test
        id: fingerprint
        run: |
          set -euo pipefail
          # Mode, blob and path of every tracked file outside docs/. The root
          # agent files keep their mode, path and presence, with a fixed
          # placeholder for their content. For a pull request this is the merge
          # result that the checks would exercise. Unquoted paths keep non-ASCII
          # docs/ names out.
          fingerprint=$(git -c core.quotePath=false ls-tree -r --full-tree HEAD |
            awk -F '\t' -v OFS='\t' '
              $2 ~ /^docs\// { next }
              $2 ~ /^(AGENTS|CLAUDE|CODEX|GEMINI)\.md$/ { sub(/ [^ ]*$/, " agent-instructions", $1) }
              { print }' |
            sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" | tee -a "$GITHUB_OUTPUT"
      - name: Look for an earlier green run of this exact code
        id: green
        if: steps.paths.outputs.code == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: ci-green-v1-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true
      - name: Reuse the merged pull request's green run
        id: merged
        if: github.event_name == 'push' && steps.paths.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Main requires up-to-date branches, so a squash merge lands the tree
          # its pull request's CI already passed. Reuse that run only when this
          # push adds one commit, the commit is a pull request's merge, the
          # request's final head contains the previous main and has this exact
          # tree, and CI passed on that head. Anything else, or any failed
          # lookup, runs every check.
          tested=false
          sha=$(git rev-parse HEAD)
          if [ -n "$BEFORE" ] && [ "$(git rev-parse --verify --quiet 'HEAD^' || true)" = "$BEFORE" ]; then
            pr=$(gh api "repos/$REPO/commits/$sha/pulls" --jq ".[] | select(.merge_commit_sha == \"$sha\") | \"\(.number) \(.head.sha)\"" 2>/dev/null | head -n 1 || true)
            number=${pr%% *}
            head=${pr##* }
            if [[ "$number" =~ ^[0-9]+$ && "$head" =~ ^[0-9a-f]{40}$ ]] &&
              git fetch --no-tags --quiet origin "refs/pull/$number/head" &&
              [ "$(git rev-parse FETCH_HEAD)" = "$head" ] &&
              git merge-base --is-ancestor "$BEFORE" "$head" &&
              [ "$(git rev-parse "$head^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ]; then
              passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=1" --jq '.total_count' 2>/dev/null || true)
              if [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then
                tested=true
                echo "Pull request #$number passed CI on $head, which has this exact tree."
              fi
            fi
          fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"
      - name: Decide what to skip
        id: plan
        env:
          CODE: ${{ steps.paths.outputs.code }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
          MERGED: ${{ steps.merged.outputs.tested }}
        run: |
          set -euo pipefail
          skip=
          if [ "$CODE" = "false" ]; then skip=docs; elif [ "$GREEN" = "true" ] || [ "$MERGED" = "true" ]; then skip=tested; fi
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"

  producer:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Preserve required matrix check names without allocating Windows/macOS for a skip.
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.skip != '' && 'ubuntu-latest' || matrix.os }}
    env:
      SKIP: ${{ needs.changes.result == 'success' && needs.changes.outputs.skip || '' }}
    steps:
      - name: Documentation-only change
        if: env.SKIP == 'docs'
        run: echo "Only docs/ or root agent instructions (AGENTS.md, CLAUDE.md, CODEX.md, GEMINI.md) changed; install, tests, builds and artifact uploads are skipped."
      # Nothing outside this run downloads its artifacts: they are test outputs,
      # and reproducibility, their only consumer, skips its comparison too.
      - name: Already tested
        if: env.SKIP == 'tested'
        run: echo "This exact code outside docs/ and the root agent instructions already passed; install, tests, builds and artifact uploads are skipped, and an earlier run built the artifacts."
      - uses: actions/checkout@v5
        if: env.SKIP == ''
      - uses: actions/setup-node@v4
        if: env.SKIP == ''
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
        if: env.SKIP == ''
      - run: npm run check
        if: env.SKIP == ''
      - uses: actions/upload-artifact@v4
        if: env.SKIP == ''
        with:
          name: agency-preview-${{ matrix.os }}
          path: dist/agency-agents/
          retention-days: 14
  reproducibility:
    needs: [changes, producer]
    if: always()
    runs-on: ubuntu-latest
    env:
      SKIP: ${{ needs.changes.result == 'success' && needs.changes.outputs.skip || '' }}
    steps:
      - name: Require every producer check
        env:
          PRODUCER_RESULT: ${{ needs.producer.result }}
        run: test "$PRODUCER_RESULT" = success
      - name: Documentation-only change
        if: env.SKIP == 'docs'
        run: echo "Only docs/ or root agent instructions (AGENTS.md, CLAUDE.md, CODEX.md, GEMINI.md) changed; there are no package artifacts to compare."
      - name: Already tested
        if: env.SKIP == 'tested'
        run: echo "An earlier run compared the artifacts of this exact code outside docs/ and the root agent instructions."
      - uses: actions/download-artifact@v4
        if: env.SKIP == ''
        with:
          pattern: agency-preview-*
          path: receipts
      - name: Compare artifact hashes across operating systems
        if: env.SKIP == ''
        shell: bash
        run: |
          set -euo pipefail
          cmp receipts/agency-preview-ubuntu-latest/agency-agents-0.1.0.catsplugin.sha256 receipts/agency-preview-windows-latest/agency-agents-0.1.0.catsplugin.sha256
          cmp receipts/agency-preview-ubuntu-latest/agency-agents-0.1.0.catsplugin.sha256 receipts/agency-preview-macos-latest/agency-agents-0.1.0.catsplugin.sha256
      # Reached only when every producer and the comparison passed, so the three
      # producer legs never race on one key. A failed detection leaves no
      # fingerprint, so nothing is recorded.
      - name: Record this code as tested
        if: env.SKIP == '' && needs.changes.outputs.fingerprint != ''
        env:
          FINGERPRINT: ${{ needs.changes.outputs.fingerprint }}
        run: |
          mkdir -p .ci-green
          echo "$FINGERPRINT $GITHUB_RUN_ID" > .ci-green/marker
      - name: Save the tested marker
        if: env.SKIP == '' && needs.changes.outputs.fingerprint != ''
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ci-green-v1-${{ needs.changes.outputs.fingerprint }}
